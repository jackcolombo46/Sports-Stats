name: Prova foto (temporaneo)
on:
  push:
    branches: [prova-foto-seriea]
    paths: ["tools/probe/foto.py", "tools/seriea/photos.py", ".github/workflows/prova-foto.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe/foto.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/probe/out
          git commit -m "Prova foto" || exit 0
          git push
