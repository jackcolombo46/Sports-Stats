name: Aggiorna dati Serie A

on:
  schedule:
    # orari UTC: notte (dopo le partite serali), primo pomeriggio e sera (dopo le partite delle 15 e 18)
    - cron: "23 0 * * *"
    - cron: "41 11 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/pbp/**", "tools/seriea/**", ".github/workflows/update-seriea.yml", "tools/backtest/**", "docs/seriea/model.js", "docs/picks.js"]

permissions:
  contents: write

concurrency:
  group: update-seriea
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stagione in corso
        run: |
          set -o pipefail
          mkdir -p docs/seriea/data
          python tools/seriea/update_data.py --skip-past 2>&1 | tee docs/seriea/data/update-log.txt
      - name: Verifica del modello (quanto ci azzecca)
        continue-on-error: true
        run: node tools/backtest/backtest.js seriea 2>&1 | tee -a docs/seriea/data/update-log.txt
      - name: Cronaca (statistiche per quarto / per minuto)
        continue-on-error: true
        timeout-minutes: 25
        run: python tools/pbp/update_pbp.py --sport seriea --max 200 2>&1 | tee -a docs/seriea/data/update-log.txt
      - name: Salva (stagione in corso)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seriea/data
          git diff --cached --quiet && exit 0
          git commit -m "Dati aggiornati seriea $(date -u +'%Y-%m-%d %H:%M UTC')"
          # più aggiornamenti possono salvare insieme: se un altro ha appena salvato, riprende le sue modifiche e riprova
          ok=0
          for n in 1 2 3 4 5; do
            git pull --rebase -q -X ours origin main || (git rebase --abort; git pull -q --no-rebase -X ours origin main)
            if git push; then ok=1; break; fi
            sleep $((n * 7))
          done
          [ "$ok" = 1 ]
      - name: Stagioni passate (solo la prima volta)
        run: |
          set -o pipefail
          python tools/seriea/update_data.py 2>&1 | tee -a docs/seriea/data/update-log.txt
      - name: Salva (stagioni passate)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seriea/data
          git diff --cached --quiet && exit 0
          git commit -m "Dati aggiornati seriea $(date -u +'%Y-%m-%d %H:%M UTC')"
          # più aggiornamenti possono salvare insieme: se un altro ha appena salvato, riprende le sue modifiche e riprova
          ok=0
          for n in 1 2 3 4 5; do
            git pull --rebase -q -X ours origin main || (git rebase --abort; git pull -q --no-rebase -X ours origin main)
            if git push; then ok=1; break; fi
            sleep $((n * 7))
          done
          [ "$ok" = 1 ]
