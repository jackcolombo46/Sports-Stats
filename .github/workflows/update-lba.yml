name: Aggiorna dati LBA

on:
  schedule:
    # ogni 3 ore dalle 12 alle 24 (ora italiana): le partite LBA si giocano soprattutto la sera e nel weekend
    - cron: "7 11-23/3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/pbp/**", "tools/lba/**", ".github/workflows/update-lba.yml", "tools/backtest/**", "docs/lba/model.js", "docs/picks.js", "docs/adv-basket.js"]

permissions:
  contents: write

concurrency:
  group: update-lba
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stagione in corso
        run: |
          set -o pipefail
          mkdir -p docs/lba/data
          python tools/lba/update_data.py --skip-past 2>&1 | tee docs/lba/data/update-log.txt
      - name: Verifica del modello (quanto ci azzecca)
        continue-on-error: true
        run: node tools/backtest/backtest.js lba 2>&1 | tee -a docs/lba/data/update-log.txt
      - name: Cronaca (statistiche per quarto / per minuto)
        continue-on-error: true
        timeout-minutes: 25
        run: python tools/pbp/update_pbp.py --sport lba --max 100 2>&1 | tee -a docs/lba/data/update-log.txt
      - name: Salva (stagione in corso)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lba/data
          git diff --cached --quiet && exit 0
          git commit -m "Dati aggiornati lba $(date -u +'%Y-%m-%d %H:%M UTC')"
          # più aggiornamenti possono salvare insieme: se un altro ha appena salvato, riprende le sue modifiche e riprova
          ok=0
          for n in 1 2 3 4 5; do
            git pull --rebase -q -X ours origin main || (git rebase --abort; git pull -q --no-rebase -X ours origin main)
            if git push; then ok=1; break; fi
            sleep $((n * 7))
          done
          [ "$ok" = 1 ]
      - name: Stagioni passate (solo la prima volta)
        run: |
          set -o pipefail
          python tools/lba/update_data.py 2>&1 | tee -a docs/lba/data/update-log.txt
      - name: Salva (stagioni passate)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lba/data
          git diff --cached --quiet && exit 0
          git commit -m "Dati aggiornati lba $(date -u +'%Y-%m-%d %H:%M UTC')"
          # più aggiornamenti possono salvare insieme: se un altro ha appena salvato, riprende le sue modifiche e riprova
          ok=0
          for n in 1 2 3 4 5; do
            git pull --rebase -q -X ours origin main || (git rebase --abort; git pull -q --no-rebase -X ours origin main)
            if git push; then ok=1; break; fi
            sleep $((n * 7))
          done
          [ "$ok" = 1 ]
