name: Prova LBA (temporanea)
on:
  push:
    branches: [main]
    paths: ["tools/lba/probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/lba/probe.py
