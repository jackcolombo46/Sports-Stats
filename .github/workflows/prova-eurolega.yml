name: Prova EuroLeague (temporaneo)
on:
  push:
    branches: [eurolega]
    paths: ["tools/probe/el_probe.py", ".github/workflows/prova-eurolega.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe/el_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/probe/out
          git commit -m "Campioni EuroLeague" || exit 0
          git push
