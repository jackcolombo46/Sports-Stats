name: Prova indisponibili (temporaneo)
on:
  push:
    branches: [infortuni-calcio]
    paths: ["tools/seriea/injuries.py", "tools/probe/inj_dry.py", ".github/workflows/prova-indisponibili.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe/inj_dry.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/probe/out
          git commit -m "Prova indisponibili" || exit 0
          git push
